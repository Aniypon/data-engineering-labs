version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.4-alpine
    container_name: clickhouse_hw9
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - clickhouse_network

volumes:
  clickhouse_data:
  clickhouse_logs:

networks:
  clickhouse_network:
    driver: bridge 